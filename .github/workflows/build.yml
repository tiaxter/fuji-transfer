name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test del protocollo (camera Fuji simulata)
        run: ./gradlew --console=plain :core:selfTest

      - name: Compila l'APK debug
        run: ./gradlew --console=plain :app:assembleDebug

      # Branch e commit nel nome del file: con archive: false l'artifact è l'APK stesso, non uno zip.
      - name: Rinomina l'APK
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/fuji-transfer-${branch//\//-}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          archive: false
          if-no-files-found: error
