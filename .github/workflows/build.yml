name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test del protocollo (camera Fuji simulata)
        run: ./gradlew --console=plain :core:selfTest

      - name: Compila l'APK debug
        run: ./gradlew --console=plain :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fuji-transfer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
